name: Update open-source stats

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recount merged pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_oss_stats.py
      - name: Commit if the numbers changed
        run: |
          if git diff --quiet README.md; then
            echo "No change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update open-source stats" README.md
          git push
